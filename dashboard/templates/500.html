<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-black">
    <!-- Sparkles Particle Background -->
    <div id="sparkles-background" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0;"></div>

    <div class="error-page">
        <div class="error-content">
            <h1 class="error-code">500</h1>
            <h2 class="error-title">Server Error</h2>
            <p class="error-message">Something went wrong. Please try again later.</p>
            <a href="/" class="btn btn-primary">
                <span class="icon">🏠</span>
                <span>Back to Dashboard</span>
            </a>
        </div>
    </div>

    <!-- Sparkles Particle Background Script -->
    <script src="{{ url_for('static', filename='js/sparkles.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            try {
                new Sparkles('sparkles-background', {
                    minSize: 0.6,
                    maxSize: 1.4,
                    speed: 1,
                    particleColor: '#FFFFFF',
                    particleDensity: 100,
                    background: 'transparent'
                });
            } catch (error) {
                console.error('Sparkles initialization failed:', error);
            }
        });
    </script>
</body>
</html>
